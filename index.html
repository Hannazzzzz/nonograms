<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hanna's Nonograms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one centred column, graph-paper board as the hero, controls above, help below */
:root {
  --bg: #e9eef2;
  --paper: #fbfcfd;
  --line: #cfd8e0;
  --line-strong: #52657a;
  --grid5: #ee9dbb;
  --ink: #1d3a5c;
  --muted: #6a7b8c;
  --fg: #172431;
  --accent: #c98a12;
  --accent-soft: rgba(201, 138, 18, 0.13);
  --cand-strong: #7a4f00;
  --done: #a9b6c3;
  --error: #c4392b;
  --ok: #12c94f;
  --ok-text: #0f7a35;
  --error-soft: rgba(196, 57, 43, 0.18);
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-clue: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cell: 28px;
  --clue-fs: 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --paper: #17202a; --line: #2a3643; --line-strong: #8396aa; --grid5: #c07895;
    --ink: #cfe0f2; --muted: #8796a6; --fg: #e3eaf1; --accent: #e8b44c;
    --accent-soft: rgba(232, 180, 76, 0.12); --done: #4a5867; --cand-strong: #ffe2a3;
    --error: #f0705f; --ok: #2ff07a; --ok-text: #5fe08f; --error-soft: rgba(240, 112, 95, 0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --paper: #17202a; --line: #2a3643; --line-strong: #8396aa; --grid5: #c07895;
  --ink: #cfe0f2; --muted: #8796a6; --fg: #e3eaf1; --accent: #e8b44c;
  --accent-soft: rgba(232, 180, 76, 0.12); --done: #4a5867; --cand-strong: #ffe2a3;
  --error: #f0705f; --ok: #2ff07a; --ok-text: #5fe08f; --error-soft: rgba(240, 112, 95, 0.22);
  color-scheme: dark;
}
html { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.view { display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.meta { font-family: var(--font-clue); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

.navbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--line-strong); }
button {
  font: 500 0.9rem var(--font-body); color: var(--fg); background: var(--paper);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
button:hover { background: var(--accent-soft); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.45; cursor: default; background: var(--paper); }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.primary:hover { background: color-mix(in srgb, var(--ink) 85%, var(--paper)); }
.seg-label { font-size: 0.85rem; color: var(--muted); }
.spacer { flex: 1; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar button { white-space: nowrap; }
button { touch-action: manipulation; }
#modeSeg button { min-height: 44px; padding: 8px 14px; }
#check { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#check:active { background: var(--accent-soft); }
.legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .swatch { color: var(--ink); }
.legend .xmark { color: var(--muted); }
[hidden] { display: none !important; }
button.danger { border-color: var(--error); color: var(--error); }
.swatch { width: 12px; height: 12px; background: currentColor; border-radius: 2px; display: inline-block; }
.xmark { font-family: var(--font-clue); font-weight: 700; }

.board-holder { display: flex; justify-content: center; }
.board {
  display: grid; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.corner { }
.cclue {
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding-bottom: 4px; gap: 1px;
}
.rclue {
  display: flex; justify-content: flex-end; align-items: center; padding-right: 6px; gap: 0.45em;
}
.cclue span, .rclue span {
  font-family: var(--font-clue); font-weight: 700; font-size: var(--clue-fs);
  font-variant-numeric: tabular-nums; color: var(--fg); line-height: 1.15;
  transition: color 0.2s;
}
.cclue.ok span, .rclue.ok span { color: var(--done); }
.cclue.hl, .rclue.hl { background: var(--accent-soft); border-radius: 4px; }

.cell {
  width: var(--cell); height: var(--cell); background: var(--paper); position: relative;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 0; margin: 0; border-radius: 0; min-height: 0; cursor: pointer; display: block;
  border-top: 0; border-left: 0; outline: none;
}
.cell:focus-visible { outline: none; }
.cell.c0 { border-left: 2px solid var(--line-strong); }
.cell.r0 { border-top: 2px solid var(--line-strong); }
.cell.b5r { border-right: 2px solid var(--grid5); }
.cell.b5b { border-bottom: 2px solid var(--grid5); }
.cell.er { border-right: 2px solid var(--line-strong); }
.cell.eb { border-bottom: 2px solid var(--line-strong); }
.cell.hl { background: color-mix(in srgb, var(--paper) 91%, var(--ink)); }
.cell.k1 { background: color-mix(in srgb, var(--paper) 80%, var(--accent)); }
.cell.k2 { background: color-mix(in srgb, var(--paper) 50%, var(--accent)); }
.cell.k1::before, .cell.k2::before {
  content: ""; position: absolute; left: 50%; top: 50%; border-radius: 50%;
  transform: translate(-50%, -50%);
}
.cell.k1::before { width: 22%; height: 22%; border: 1.5px solid var(--accent); }
.cell.k2::before { width: 34%; height: 34%; background: var(--cand-strong); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
.cell.s1 { background: var(--ink); }
.cell.s2::before, .cell.s2::after {
  content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 2px;
  background: var(--muted); border-radius: 1px;
}
.cell.s2::before { transform: rotate(45deg); }
.cell.s2::after { transform: rotate(-45deg); }
.cell:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.cell.err { box-shadow: inset 0 0 0 3px var(--error); }
.cell.err.s2::before, .cell.err.s2::after { background: var(--error); }

.board { position: relative; }
.grid-frame {
  grid-column: 2 / -1; grid-row: 2 / -1; position: absolute; inset: -3px;
  border: 4px solid transparent; border-radius: 6px; pointer-events: none; z-index: 1;
}
.board.all-ok .grid-frame { border-color: var(--ok); }
.board.solved .cell { cursor: default; }
.board.solved .cell.s2::before, .board.solved .cell.s2::after { opacity: 0; transition: opacity 0.6s; }
.board.solved .cell { border-color: var(--paper); transition: border-color 0.8s; }
.board.solved .cell.k1, .board.solved .cell.k2 { background: var(--paper); }
.board.solved .cell.k1::before, .board.solved .cell.k2::before { display: none; }

.status { min-height: 1.4em; font-size: 0.95rem; text-align: center; color: var(--muted); }
.status.bad { color: var(--error); }
.status.good { color: var(--fg); }
.solved-banner {
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.solved-banner h2 { font-family: var(--font-display); margin: 0; font-size: 1.35rem; }
.solved-banner p { margin: 0; color: var(--muted); }

.help { font-size: 0.88rem; color: var(--muted); line-height: 1.55; max-width: 62ch; }
.help h2 { font-family: var(--font-display); font-size: 0.95rem; color: var(--fg); margin: 0 0 6px; }
.help p { margin: 0; }
.help p + p { margin-top: 10px; }
.help a { color: var(--ink); font-weight: 500; text-underline-offset: 3px; }
kbd { font-family: var(--font-clue); font-size: 0.8em; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--paper); }

/* History */
.hist-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hist-head h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; flex: 1; }
.hlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hrow {
  display: flex; align-items: center; gap: 10px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 8px 8px;
}
.hrow.current { border-color: var(--line-strong); }
.hopen {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; border: 0; background: none;
  padding: 2px; text-align: left; min-height: 0; border-radius: 6px;
}
.hopen:hover { background: none; }
.hopen:hover .htitle { text-decoration: underline; text-underline-offset: 3px; }
.hthumb { flex: none; border-radius: 4px; border: 1px solid var(--line); background: var(--paper); display: block; }
.hinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.htitle { font-weight: 600; color: var(--fg); }
.hsub { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill {
  font-family: var(--font-clue); font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor; align-self: flex-start;
}
.pill.solved { color: var(--ok-text); }
.pill.progress { color: var(--accent); }
.hremove { flex: none; font-size: 0.82rem; min-height: 32px; padding: 4px 10px; border-color: var(--line); color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 28px 0; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<div class="wrap">
  <header>
    <h1>Hanna's Nonograms</h1>
    <span class="meta" id="meta"></span>
  </header>

  <nav class="navbar" aria-label="Puzzles">
    <span class="seg-label" id="sizeLabel">Size</span>
    <div class="seg" role="group" aria-labelledby="sizeLabel" id="sizeSeg">
      <button data-size="10" aria-pressed="false">10</button>
      <button data-size="15" aria-pressed="true">15</button>
      <button data-size="20" aria-pressed="false">20</button>
    </div>
    <button id="newPuzzle" class="primary">New puzzle</button>
    <span class="spacer"></span>
    <button id="historyBtn">History</button>
  </nav>

  <section class="view" id="playView">
    <div class="toolbar" role="toolbar" aria-label="Puzzle controls">
      <div class="seg" role="group" aria-label="Mode" id="modeSeg" hidden>
        <button data-mode="1" aria-pressed="true"><span class="swatch" aria-hidden="true"></span> Fill</button>
        <button data-mode="2" aria-pressed="false"><span class="xmark" aria-hidden="true">✕</span> Cross</button>
        <button data-mode="3" aria-pressed="false"><span class="dot" aria-hidden="true"></span> Candidate</button>
      </div>
      <p class="legend">
        <span><span class="swatch" aria-hidden="true"></span> Tap: fill</span>
        <span><span class="xmark" aria-hidden="true">✕</span> Two-finger tap, or hold <kbd>⌘</kbd> and move: cross</span>
        <span><span class="dot" aria-hidden="true"></span> Hold <kbd>Option</kbd> and move: candidate</span>
      </p>
      <span class="spacer"></span>
      <div class="actions">
        <button id="undo" disabled>Undo</button>
        <button id="check" title="Hold to show mistakes">Hold to check</button>
        <button id="clearMistakes">Clear lines with mistakes</button>
        <button id="clearCand">Clear candidates</button>
        <button id="reset">Reset</button>
      </div>
    </div>

    <div class="board-holder" id="holder">
      <div class="board" id="board" aria-label="Nonogram grid"></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="solved-banner" id="banner" hidden>
      <h2 id="bannerTitle"></h2>
      <p>Solved. Your finished grid stays here until you reset it.</p>
      <button id="bannerNew" class="primary">New puzzle</button>
    </div>

    <section class="help">
      <h2>Keyboard</h2>
      <p>Arrow keys to move, <kbd>Space</kbd> to fill, <kbd>X</kbd> to mark, <kbd>C</kbd> to add a candidate, <kbd>Ctrl</kbd>+<kbd>Z</kbd> to undo.</p>
      <p><a href="https://activityworkshop.net/puzzlesgames/nonograms/tutorial.html" target="_blank" rel="noopener">How to solve a nonogram</a></p>
    </section>
  </section>

  <section class="view" id="historyView" hidden>
    <div class="hist-head">
      <h2>History</h2>
      <div class="seg" role="group" aria-label="Filter" id="histFilter">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="progress" aria-pressed="false">In progress</button>
        <button data-f="solved" aria-pressed="false">Solved</button>
      </div>
      <button id="backBtn">Back to puzzle</button>
    </div>
    <ul class="hlist" id="hlist"></ul>
    <p class="empty" id="hempty" hidden></p>
  </section>
</div>

<script>
// Built-in puzzles: clues and solution generated and verified by script (unique, solvable by line logic alone).
const PUZZLES = [{"id": "boat-15", "number": 1, "title": "Sailing boat", "rows": [[2], [1, 4], [2, 4], [3, 2], [4], [1, 4], [2, 5], [3, 6], [4, 7], [5, 7], [1], [13], [11], [1, 9, 1], [2, 1, 1, 2]], "cols": [[1], [1, 1, 1], [2, 2, 1], [3, 3], [4, 3], [5, 4], [4, 4], [8, 3], [7, 3], [6, 4], [2, 5, 3], [4, 4, 3], [4, 3, 2, 1], [2, 2, 1, 1], [1]], "solution": ["...........##..", "......#...####.", "......##..####.", "......###..##..", "......####.....", ".....#.####....", "....##.#####...", "...###.######..", "..####.#######.", ".#####.#######.", "......#........", ".#############.", "..###########..", "#..#########..#", ".##..#...#..##."]}];

// ---------- generator and line solver ----------
// New puzzles are only accepted when line logic alone solves every cell from the clues,
// which also proves the solution is unique.
// Nonogram generator + line solver. Shared between Node tests and the page.
function clueOf(line) {
  const out = []; let n = 0;
  for (const v of line) { if (v) n++; else if (n) { out.push(n); n = 0; } }
  if (n) out.push(n);
  return out;
}

// Line solver: given clue and known cells (-1 unknown, 0 empty, 1 filled),
// returns new array with every cell forced by all valid placements, or null if contradiction.
function solveLine(clue, known) {
  const n = known.length, k = clue.length;
  // canPlace[i][j]: can cells i..n-1 be completed with clues j..k-1
  const can = Array.from({ length: n + 2 }, () => new Uint8Array(k + 1));
  // suffix: can[i][j]
  const okEmpty = new Uint8Array(n + 1); // cells i..n-1 can all be empty
  okEmpty[n] = 1;
  for (let i = n - 1; i >= 0; i--) okEmpty[i] = okEmpty[i + 1] && known[i] !== 1 ? 1 : 0;
  // noZero[i][len]: cells i..i+len-1 can all be filled -> use prefix count of zeros
  const zeros = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) zeros[i + 1] = zeros[i] + (known[i] === 0 ? 1 : 0);
  const fillable = (i, len) => i + len <= n && zeros[i + len] - zeros[i] === 0;
  for (let i = n; i >= 0; i--) {
    can[i][k] = okEmpty[i];
    for (let j = k - 1; j >= 0; j--) {
      let v = 0;
      // option 1: cell i empty
      if (i < n && known[i] !== 1 && can[i + 1][j]) v = 1;
      // option 2: block j starts at i
      const L = clue[j];
      if (!v && fillable(i, L)) {
        const e = i + L;
        if (e === n) v = j === k - 1 ? 1 : 0;
        else if (known[e] !== 1 && can[e + 1][j + 1]) v = 1;
      }
      can[i][j] = v;
    }
  }
  if (!can[0][0]) return null;
  // forward reachability: reach[i][j] = prefix 0..i-1 consistent having placed j blocks, at position i free to start
  const reach = Array.from({ length: n + 2 }, () => new Uint8Array(k + 1));
  reach[0][0] = 1;
  const canFill = new Uint8Array(n), canEmpty = new Uint8Array(n);
  const diff = new Int32Array(n + 1);
  for (let i = 0; i <= n; i++) {
    for (let j = 0; j <= k; j++) {
      if (!reach[i][j]) continue;
      if (i < n && known[i] !== 1) {
        // cell i empty, rest must still be completable
        if (can[i + 1][j]) { canEmpty[i] = 1; reach[i + 1][j] = 1; }
      }
      if (j < k) {
        const L = clue[j];
        if (fillable(i, L)) {
          const e = i + L;
          let viable = false;
          if (e === n) viable = j === k - 1;
          else if (known[e] !== 1) viable = !!can[e + 1][j + 1];
          if (viable) {
            diff[i]++; diff[e]--;
            if (e < n) { canEmpty[e] = 1; reach[e + 1][j + 1] = 1; }
          }
        }
      }
    }
  }
  let run = 0;
  for (let i = 0; i < n; i++) { run += diff[i]; if (run > 0) canFill[i] = 1; }
  const out = known.slice();
  for (let i = 0; i < n; i++) {
    if (canFill[i] && !canEmpty[i]) out[i] = 1;
    else if (!canFill[i] && canEmpty[i]) out[i] = 0;
    else if (!canFill[i] && !canEmpty[i]) return null;
  }
  return out;
}

// Returns {solved, passes, grid}
function lineSolve(rows, cols) {
  const R = rows.length, C = cols.length;
  const g = Array.from({ length: R }, () => Array(C).fill(-1));
  let dirtyR = new Set([...Array(R).keys()]), dirtyC = new Set([...Array(C).keys()]);
  let passes = 0;
  while (dirtyR.size || dirtyC.size) {
    passes++;
    const nR = new Set(), nC = new Set();
    for (const r of dirtyR) {
      const res = solveLine(rows[r], g[r]);
      if (!res) return { solved: false, contradiction: true, passes, grid: g };
      for (let c = 0; c < C; c++) if (res[c] !== g[r][c]) { g[r][c] = res[c]; nC.add(c); }
    }
    for (const c of [...dirtyC, ...nC]) {
      const col = g.map(row => row[c]);
      const res = solveLine(cols[c], col);
      if (!res) return { solved: false, contradiction: true, passes, grid: g };
      for (let r = 0; r < R; r++) if (res[r] !== g[r][c]) { g[r][c] = res[r]; nR.add(r); }
    }
    dirtyR = nR; dirtyC = new Set();
  }
  const solved = g.every(row => row.every(v => v !== -1));
  return { solved, passes, grid: g };
}

function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

// Blobby random picture: noise then majority smoothing.
function randomPicture(R, C, rnd) {
  const density = 0.5 + rnd() * 0.12;
  let g = Array.from({ length: R }, () => Array.from({ length: C }, () => (rnd() < density ? 1 : 0)));
  const rounds = 1 + (rnd() < 0.5 ? 1 : 0);
  for (let t = 0; t < rounds; t++) {
    const ng = g.map(row => row.slice());
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      let s = 0, cnt = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const y = r + dr, x = c + dc;
        cnt++;
        if (y >= 0 && y < R && x >= 0 && x < C) s += g[y][x];
      }
      if (s >= 5) ng[r][c] = 1; else if (s <= 3) ng[r][c] = 0;
    }
    g = ng;
  }
  return g;
}

// Generate a picture whose clues are uniquely solvable by line logic alone.
// When the solver gets stuck, flip one unresolved cell and try again.
function generatePuzzle(R, C, seed, maxTries = 400) {
  const rnd = makeRng(seed);
  let pic = randomPicture(R, C, rnd);
  let restarts = 0;
  for (let t = 0; t < maxTries; t++) {
    const rows = pic.map(clueOf), cols = [...Array(C).keys()].map(c => clueOf(pic.map(row => row[c])));
    const res = lineSolve(rows, cols);
    const fill = pic.flat().reduce((a, b) => a + b, 0) / (R * C);
    if (res.solved && res.passes >= 3 && fill > 0.35 && fill < 0.75) {
      return { rows, cols, solution: pic.map(row => row.map(v => (v ? "#" : ".")).join("")), passes: res.passes, tries: t, restarts };
    }
    if (res.solved || fill <= 0.35 || fill >= 0.75) { pic = randomPicture(R, C, rnd); restarts++; continue; }
    const unknown = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (res.grid[r][c] === -1) unknown.push([r, c]);
    const [r, c] = unknown[Math.floor(rnd() * unknown.length)];
    pic[r][c] ^= 1;
  }
  return null;
}

// Make several verified candidates and keep the one that needs the most solver passes.
function generateBest(R, C, seeds) {
  let best = null;
  for (const s of seeds) {
    const p = generatePuzzle(R, C, s);
    if (p && (!best || p.passes > best.passes)) best = p;
  }
  return best;
}

    }
    clearErrors();
    undoStack.push(changes);
    save(); renderAll();
    setStatus(`Cleared ${plural(rows.size, "row", "rows")} and ${plural(cols.size, "column", "columns")} with mistakes. Undo brings them back.`);
  });

  let resetArmed = null;
  resetBtn.addEventListener("click", () => {
    if (!resetArmed) {
      resetBtn.textContent = "Confirm reset";
      resetBtn.classList.add("danger");
      resetArmed = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    cells = Array.from({ length: R }, () => Array(C).fill(0));
    cand = Array.from({ length: R }, () => Array(C).fill(0));
    undoStack = [];
    clearErrors();
    setSolved(false);
    setStatus("Grid cleared.");
    save(); renderAll();
  });
  function disarm() {
    clearTimeout(resetArmed); resetArmed = null;
    resetBtn.textContent = "Reset"; resetBtn.classList.remove("danger");
  }

  // ---------- switching puzzles ----------
  // A generated puzzle that was never touched is dropped when you move on, so History stays clean.
  function dropIfUntouched(id) {
    if (!id || !id.startsWith("gen-")) return;
    if (hasProgress(store.get(recKey(id)))) return;
    generated = generated.filter(p => p.id !== id);
    saveGenerated();
    store.del(recKey(id));
  }
  function openPuzzle(id) {
    if (P && P.id !== id) dropIfUntouched(P.id);
    P = findPuzzle(id) || PUZZLES[0];
    store.set(CUR_KEY, P.id);
    R = P.solution.length; C = P.solution[0].length;
    SOL = P.solution.map(row => [...row].map(ch => ch === "#" ? 1 : 0));
    KEY = recKey(P.id);
    cells = Array.from({ length: R }, () => Array(C).fill(0));
    cand = Array.from({ length: R }, () => Array(C).fill(0));
    undoStack = []; stroke = null; hl = null; focus = { r: 0, c: 0 };
    lastHover = null; hoverStroke = 0; armed = 0; activePointer = null;
    clearTimeout(pressTimer); disarm();
    metaEl.textContent = `No. ${P.number} · ${R} × ${C}`;
    build(); load(); layout(); renderAll();
    setSolved(checkSolved());
    // Older saves have no solved date: add one without changing when it was last played.
    if (solved) {
      const rec = store.get(KEY);
      if (rec && !rec.solvedAt) store.set(KEY, { ...rec, solvedAt: rec.updated || Date.now() });
    }
    setStatus("");
  }

  // ---------- new puzzle ----------
  let size = [10, 15, 20].includes(store.get(SIZE_KEY)) ? store.get(SIZE_KEY) : 15;
  const sizeSeg = document.getElementById("sizeSeg");
  function renderSize() {
    sizeSeg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.size === size)));
  }
  sizeSeg.addEventListener("click", e => {
    const b = e.target.closest("button[data-size]");
    if (!b) return;
    size = +b.dataset.size; store.set(SIZE_KEY, size); renderSize();
  });
  function randomSeeds(n) {
    const a = new Uint32Array(n);
    try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 4294967295); }
    return [...a].map(x => x || 1);
  }
  function newPuzzle() {
    const p = generateBest(size, size, randomSeeds(6)) || generateBest(size, size, randomSeeds(12));
    if (!p) { showView("play"); setStatus("Couldn't make a puzzle this time. Try again.", "bad"); return; }
    if (P) dropIfUntouched(P.id);
    const number = Math.max(0, ...allPuzzles().map(q => q.number || 0)) + 1;
    const id = "gen-" + Date.now().toString(36) + randomSeeds(1)[0].toString(36).slice(0, 4);
    generated.push({ id, number, title: `Pattern No. ${number}`, created: Date.now(), rows: p.rows, cols: p.cols, solution: p.solution });
    saveGenerated();
    showView("play");
    openPuzzle(id);
  }
  document.getElementById("newPuzzle").addEventListener("click", newPuzzle);
  document.getElementById("bannerNew").addEventListener("click", newPuzzle);

  // ---------- history ----------
  let view = "play", filter = "all";
  const playView = document.getElementById("playView"), historyView = document.getElementById("historyView");
  const historyBtn = document.getElementById("historyBtn");
  function showView(v) {
    view = v;
    playView.hidden = v !== "play";
    historyView.hidden = v !== "history";
    historyBtn.setAttribute("aria-pressed", String(v === "history"));
    if (v === "history") { highlight(null); renderHistory(); }
    else requestAnimationFrame(layout);
  }
  historyBtn.addEventListener("click", () => showView(view === "history" ? "play" : "history"));
  document.getElementById("backBtn").addEventListener("click", () => showView("play"));
  const histFilter = document.getElementById("histFilter");
  histFilter.addEventListener("click", e => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    filter = b.dataset.f; renderHistory();
  });

  const fmt = (() => {
    try { return new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return null; }
  })();
  const when = t => t ? (fmt ? fmt.format(new Date(t)) : new Date(t).toLocaleString()) : "";

  function historyItems() {
    return allPuzzles().map(p => {
      const rec = store.get(recKey(p.id));
      if (!hasProgress(rec)) return null;
      const n = p.solution.length * p.solution[0].length;
      const grid = typeof rec.cells === "string" && rec.cells.length === n ? rec.cells : "0".repeat(n);
      const sol = p.solution.join("");
      const complete = [...sol].every((ch, i) => (ch === "#") === (grid[i] === "1"));
      const isSolved = !!rec.solvedAt || complete;
      const filled = [...grid].filter(ch => ch === "1").length;
      const total = [...sol].filter(ch => ch === "#").length;
      return { p, rec, grid, isSolved, filled, total, t: rec.updated || rec.solvedAt || 0 };
    }).filter(Boolean).sort((a, b) => b.t - a.t);
  }

  function drawThumb(canvas, item) {
    const p = item.p, rows = p.solution.length, cols = p.solution[0].length;
    const px = Math.max(2, Math.floor(60 / Math.max(rows, cols)));
    const w = cols * px, h = rows * px, dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    ctx.fillStyle = cs.getPropertyValue("--paper").trim() || "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = cs.getPropertyValue("--ink").trim() || "#000";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const on = item.isSolved ? p.solution[r][c] === "#" : item.grid[r * cols + c] === "1";
      if (on) ctx.fillRect(c * px, r * px, px, px);
    }
  }

  function removeEntry(id) {
    store.del(recKey(id));
    if (id.startsWith("gen-") && (!P || P.id !== id)) {
      generated = generated.filter(p => p.id !== id); saveGenerated();
    }
    if (P && P.id === id) openPuzzle(id); // current puzzle starts again from a blank grid
    renderHistory();
  }

  function renderHistory() {
    const items = historyItems();
    const counts = { all: items.length, progress: items.filter(i => !i.isSolved).length, solved: items.filter(i => i.isSolved).length };
    histFilter.querySelectorAll("button").forEach(b => {
      const f = b.dataset.f;
      b.setAttribute("aria-pressed", String(f === filter));
      b.textContent = `${{ all: "All", progress: "In progress", solved: "Solved" }[f]} (${counts[f]})`;
    });
    const shown = items.filter(i => filter === "all" || (filter === "solved") === i.isSolved);
    const list = document.getElementById("hlist");
    list.innerHTML = "";
    const empty = document.getElementById("hempty");
    empty.hidden = shown.length > 0;
    empty.textContent = items.length
      ? (filter === "solved" ? "Nothing solved yet." : "Nothing in progress.")
      : "No puzzles started yet. Fill a cell and it shows up here.";
    for (const item of shown) {
      const li = document.createElement("li");
      li.className = "hrow" + (P && item.p.id === P.id ? " current" : "");
      const open = document.createElement("button");
      open.className = "hopen";
      open.setAttribute("aria-label", `Open ${item.p.title}`);
      const cv = document.createElement("canvas");
      cv.className = "hthumb";
      cv.setAttribute("aria-hidden", "true");
      drawThumb(cv, item);
      const info = document.createElement("span");
      info.className = "hinfo";
      const title = document.createElement("span");
      title.className = "htitle";
      title.textContent = item.p.title;
      const sub = document.createElement("span");
      sub.className = "hsub";
      const dims = `${item.p.solution.length} × ${item.p.solution[0].length}`;
      const isCur = P && item.p.id === P.id ? " · Current" : "";
      sub.textContent = item.isSolved
        ? `${dims} · Solved${item.rec.solvedAt ? " " + when(item.rec.solvedAt) : ""}${isCur}`
        : `${dims} · ${item.filled} of ${item.total} filled${item.t ? " · " + when(item.t) : ""}${isCur}`;
      const pill = document.createElement("span");
      pill.className = "pill " + (item.isSolved ? "solved" : "progress");
      pill.textContent = item.isSolved ? "Solved" : "In progress";
      info.append(pill, title, sub);
      open.append(cv, info);
      open.addEventListener("click", () => { openPuzzle(item.p.id); showView("play"); });

      const rm = document.createElement("button");
      rm.className = "hremove";
      rm.textContent = "Remove";
      let armedRm = null;
      rm.addEventListener("click", () => {
        if (!armedRm) {
          rm.textContent = "Confirm"; rm.classList.add("danger");
          armedRm = setTimeout(() => { armedRm = null; rm.textContent = "Remove"; rm.classList.remove("danger"); }, 3000);
          return;
        }
        clearTimeout(armedRm);
        removeEntry(item.p.id);
      });
      li.append(open, rm);
      list.appendChild(li);
    }
  }

  // ---------- start ----------
  renderSize();
  openPuzzle(store.get(CUR_KEY) || PUZZLES[0].id);
})();
</script>

</body>
</html>
